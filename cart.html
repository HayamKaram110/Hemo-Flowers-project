<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/all.css">

    <title>Hemo Flowers | Cart</title>

</head>


<body class="bg-stone-100 text-[#343936]">


    <!-- ================================================== -->
    <!-- NAVBAR -->
    <!-- ================================================== -->

    <nav
        class="w-full fixed top-0 left-0 z-[10000]
        bg-[#FBFAF7]/95 backdrop-blur-md
        border-b border-[#E4E1D8]
        shadow-sm
        px-4 md:px-10
        py-2.5 md:py-3
        flex items-center justify-between">


        <!-- LOGO -->

        <div class="flex items-center">

            <a href="index.html">

                <img
                    src="images/logo.png"
                    class="w-16 h-16 md:w-20 md:h-20 object-contain rounded-full"
                    alt="Hemo Flowers Logo">

            </a>

        </div>


        <!-- NAV BUTTONS -->

        <div class="flex items-center gap-2 md:gap-4">


            <!-- HOME -->

            <a
                href="index.html"
                class="hidden sm:flex
                items-center gap-2
                px-4 py-2
                rounded-2xl
                text-[#5E685F]
                font-semibold
                hover:bg-[#EEF2EC]
                transition-all duration-300">

                <i class="fas fa-home text-sm"></i>

                Home

            </a>


            <!-- CART -->

            <a
                href="cart.html"
                class="flex
                items-center justify-center
                w-11 h-11
                rounded-full
                bg-[#EEF2EC]
                text-[#5E685F]
                transition-all duration-300">

                <i class="fas fa-shopping-cart text-lg"></i>
                <span id="cart-count" class="ml-1">0</span>

            </a>


            <!-- LOGOUT -->

            <button
                id="logout-btn"
                class="px-4 md:px-5
                py-2
                rounded-2xl
                border border-[#C8D0C7]
                bg-[#FBFAF7]
                text-[#5E685F]
                font-semibold
                hover:bg-[#EEF2EC]
                hover:shadow-md
                transition-all duration-300">

                Logout

            </button>

        </div>

    </nav>



    <!-- ================================================== -->
    <!-- PAGE HEADER -->
    <!-- ================================================== -->

    <section
        class="pt-32 md:pt-36
        pb-10
        px-4 md:px-8">

        <div
            class="max-w-7xl mx-auto
            text-center">

            <h1
                class="text-3xl md:text-4xl lg:text-5xl
                font-semibold
                text-[#343936]">

                Your Shopping Cart

            </h1>
            <p
                    class="mt-3
                    text-[#8A918B]">

                    Products you've aded to Cart.

                </p>

        </div>

    </section>



    <!-- ================================================== -->
    <!-- SHOPPING CART -->
    <!-- ================================================== -->

    <section
        class="w-full
        px-4 md:px-8
        pb-16">

        <div
            class="max-w-7xl mx-auto">


            <!-- CART TITLE -->

            <div
                class="flex
                items-center
                gap-3
                mb-7">


                <div>


                </div>

            </div>



            <!-- ================================================== -->
            <!-- CART PRODUCTS -->
            <!-- ================================================== -->

            <div
                id="cart-products"
                class="grid
                grid-cols-1
                md:grid-cols-2
                lg:grid-cols-2
                gap-6
                ">

                
            </div>



          <!-- ================================================== -->
<!-- TOTAL PRICE -->
<!-- ================================================== -->

<div
    class="mt-10
    bg-[#FBFAF7]
    border border-[#E4E1D8]
    rounded-[28px]
    p-6 md:p-8
    shadow-sm
    flex items-center justify-center"
>

    <div
        class="flex
        items-center
        justify-center
        gap-4 md:gap-6
        text-center"
    >

        <!-- TOTAL TEXT -->

        <p
            class="text-lg md:text-xl
            font-semibold
            text-[#8A918B]"
        >
            Total Price :
        </p>


        <!-- TOTAL NUMBER -->

        <h2
            id="total-price"
            class="text-3xl md:text-4xl
            font-bold
            text-[#71806F]"
        >
            0 LE
        </h2>

    </div>

</div>

            </div>

        </div>

    </section>



    <!-- ================================================== -->
    <!-- DIVIDER -->
    <!-- ================================================== -->

    <div
        class="max-w-7xl mx-auto
        px-4 md:px-8">

        <div
            class="h-px
            bg-[#D9DDD5]">
        </div>

    </div>



    <!-- ================================================== -->
    <!-- FAVORITES -->
    <!-- ================================================== -->

    <section
        class="w-full
        px-4 md:px-8
        py-16">

        <div
            class="max-w-7xl mx-auto">


            <!-- FAVORITES HEADER -->

            <div
                class="text-center
                mb-10">


                <!-- HEART ICON -->


                <h2
                    class="text-3xl md:text-4xl
                    font-semibold
                    text-[#343936]">

                    Your Favorites

                </h2>


                <p
                    class="mt-3
                    text-[#8A918B]">

                    Products you've saved for later.

                </p>

            </div>



            <!-- ================================================== -->
            <!-- FAVORITES PRODUCTS -->
            <!-- ================================================== -->

            <div
                id="favorites-products"
                class="grid
                grid-cols-1
                md:grid-cols-2
                lg:grid-cols-3
                gap-3
                items-stretch
                justify-items-center">

                <!-- Favorites will be added by cart.js -->

            </div>

        </div>

    </section>

    <script src="js/cart.js"></script>
    <script src="js/script.js"></script>


</body>

</html>
