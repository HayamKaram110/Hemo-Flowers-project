<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | Hemo Flowers</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<link rel="stylesheet" href="css/all.css">

</head>

<body class="min-h-screen bg-[#F3F0E8] flex items-center justify-center px-4 py-8">

<div class="w-full max-w-md">

    <div class="bg-[#FBFAF7] rounded-[30px] shadow-[0_10px_40px_rgba(60,70,60,0.12)] border border-[#E4E1D8] overflow-hidden">


        <!-- HEADER -->

        <div class="text-center pt-8 px-8">

            <img
                src="images/logo.png"
                class="w-24 h-24 object-contain rounded-full mx-auto mb-4"
                alt="Hemo Flowers Logo"
            >

            <h2 class="text-2xl font-semibold text-[#343936]">
                Create Account
            </h2>

            <p class="text-sm text-[#777D78] mt-2">
                Join Hemo Flowers and discover something beautiful
            </p>

        </div>


        <!-- REGISTER FORM -->

        <form class="px-8 py-8" id="register-form">


            <!-- FIRST NAME -->

            <div class="mb-4">

                <label
                    class="block text-sm font-medium text-[#4F5751] mb-2"
                >
                    First Name
                </label>

                <div class="relative">

                    <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-[#8C9A89]"></i>

                    <input
                        type="text"
                        placeholder="Enter First Name"
                        id="firstName"
                        class="w-full h-12 pl-11 pr-4 rounded-2xl border border-[#D9DDD5] bg-[#F8F7F2] text-[#343936] placeholder-[#A5AAA5] outline-none focus:ring-2 focus:ring-[#AEB9AA] focus:border-[#8C9A89] transition duration-300"
                    >

                </div>

            </div>


            <!-- LAST NAME -->

            <div class="mb-4">

                <label
                    class="block text-sm font-medium text-[#4F5751] mb-2"
                >
                    Last Name
                </label>

                <div class="relative">

                    <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-[#8C9A89]"></i>

                    <input
                        type="text"
                        placeholder="Enter Last Name"
                        id="lastName"
                        class="w-full h-12 pl-11 pr-4 rounded-2xl border border-[#D9DDD5] bg-[#F8F7F2] text-[#343936] placeholder-[#A5AAA5] outline-none focus:ring-2 focus:ring-[#AEB9AA] focus:border-[#8C9A89] transition duration-300"
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="mb-4">

                <label
                    class="block text-sm font-medium text-[#4F5751] mb-2"
                >
                    Email
                </label>

                <div class="relative">

                    <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-[#8C9A89]"></i>

                    <input
                        type="email"
                        placeholder="Enter Email"
                        id="email"
                        class="w-full h-12 pl-11 pr-4 rounded-2xl border border-[#D9DDD5] bg-[#F8F7F2] text-[#343936] placeholder-[#A5AAA5] outline-none focus:ring-2 focus:ring-[#AEB9AA] focus:border-[#8C9A89] transition duration-300"
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-6">

                <label
                    class="block text-sm font-medium text-[#4F5751] mb-2"
                >
                    Password
                </label>

                <div class="relative">

                    <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-[#8C9A89]"></i>

                    <input
                        type="password"
                        placeholder="Enter Password"
                        id="password"
                        class="w-full h-12 pl-11 pr-4 rounded-2xl border border-[#D9DDD5] bg-[#F8F7F2] text-[#343936] placeholder-[#A5AAA5] outline-none focus:ring-2 focus:ring-[#AEB9AA] focus:border-[#8C9A89] transition duration-300"
                    >

                </div>

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                id="register"
                class="w-full h-12 rounded-2xl bg-[#71806F] text-white font-semibold shadow-sm hover:bg-[#5E6C5C] hover:shadow-md active:scale-[0.98] transition-all duration-300"
            >

                <i class="fas fa-user-plus mr-2"></i>

                Register

            </button>


            <!-- LOGIN -->

            <p class="text-center text-sm text-[#777D78] mt-6">

                Have an account?

                <a
                    href="login.html"
                    class="font-semibold text-[#9A747A] hover:text-[#7F5D63] transition"
                >
                    Login
                </a>

            </p>


        </form>

    </div>

</div>


<script src="js/register.js"></script>

</body>

</html>
